<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHACL Form Generator</title>
    <link rel="icon" href="data:,">

    <script type="module" src="./src/form-default.ts"></script>
    <script type="module" src="./demo/generic-page-entry.ts"></script>

    <link rel="stylesheet" href="./demo/shacl-form.css">
</head>
<body>
    <div class="demo-page">
    <header>
        <h1>SHACL Form Generator</h1>
        <nav>
            <a href="./rml/">RML demo</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h2>Shapes Graph</h2>
            <input id="shapes-url" type="url" placeholder="Shapes Graph URL">
            <textarea id="shapes-editor" spellcheck="false" placeholder="Paste SHACL shapes here"></textarea>
            <div class="panel-actions">
                <button id="apply-shapes-btn" type="button">Apply shapes</button>
                <button id="load-shapes-url-btn" type="button">Load URL</button>
            </div>
        </section>

        <section id="form-panel" class="panel">
            <h2>Generated form</h2>
            <shacl-form
                id="shacl-form"
                data-collapse=""
                data-values-namespace="http://example.org/"
                data-show-node-ids
            ></shacl-form>
        </section>

        <section class="panel">
            <h2>Generated Turtle</h2>
            <pre id="rdf-output"></pre>
            <div class="panel-actions">
                <button id="export-btn" type="button">Download .ttl</button>
            </div>
        </section>
    </main>
    </div>
</body>
</html>
