<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RML Authoring Demo</title>
    <link rel="icon" href="data:,">

    <script type="module" src="../src/form-default.ts"></script>

    <script type="module">
        const form = document.getElementById('shacl-form');
        const shapesEditor = document.getElementById('shapes-editor');
        const shapesPanel = document.getElementById('shapes-panel');
        const outputPanel = document.getElementById('output-panel');
        const outputPre = document.getElementById('rdf-output');
        const applyShapesBtn = document.getElementById('apply-shapes-btn');
        const toggleShapesBtn = document.getElementById('toggle-shapes-btn');
        const toggleOutputBtn = document.getElementById('toggle-output-btn');
        const exportBtn = document.getElementById('export-btn');

        function updateOutput(valid) {
            outputPre.innerText = form.serialize();
            outputPre.classList.toggle('valid', valid !== false);
            outputPre.classList.toggle('invalid', valid === false);
        }

        function updateLayout() {
            const visibleSidePanels = [shapesPanel, outputPanel].filter(panel => !panel.hidden).length;
            document.body.dataset.layout = visibleSidePanels.toString();
            toggleShapesBtn.innerText = shapesPanel.hidden ? 'Show shapes' : 'Hide shapes';
            toggleOutputBtn.innerText = outputPanel.hidden ? 'Show RDF' : 'Hide RDF';
        }

        form.addEventListener('change', event => {
            updateOutput(event.detail?.valid);
        });

        form.addEventListener('submit', event => {
            event.preventDefault();
            updateOutput(true);
        });

        applyShapesBtn.addEventListener('click', () => {
            form.removeAttribute('data-shapes-url');
            form.dataset.shapes = shapesEditor.value;
            outputPre.innerText = 'Interacting with form...';
            outputPre.classList.remove('valid', 'invalid');
        });

        toggleShapesBtn.addEventListener('click', () => {
            shapesPanel.hidden = !shapesPanel.hidden;
            updateLayout();
        });

        toggleOutputBtn.addEventListener('click', () => {
            outputPanel.hidden = !outputPanel.hidden;
            updateLayout();
        });

        exportBtn.addEventListener('click', () => {
            const triples = form.serialize();
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(new Blob([triples], { type: 'text/turtle' }));
            link.download = 'rml-output.ttl';
            link.click();
        });
        const shapeFiles = [
            'core-authoring.ttl',
            'io.ttl',
            'authoring-overlay.ttl'
        ];
        Promise.all(
            shapeFiles.map(file =>
                fetch(file).then(response => response.text())
            )
        ).then(parts => {
            const text = parts.join('\n\n');

            shapesEditor.value = text;
            form.dataset.shapes = text;
            form.removeAttribute('data-shapes-url');
        });

        updateLayout();
    </script>

    <style>
        :root {
            color: #1f2933;
            background: #f5f7f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: #22313f;
            color: white;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            width: 100%;
        }

        .toolbar-title {
            font-weight: 700;
            margin-right: auto;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
        }

        button {
            border: 1px solid #b8c3cc;
            border-radius: 4px;
            background: white;
            color: #22313f;
            cursor: pointer;
            font: inherit;
            padding: 0.45rem 0.7rem;
        }

        header button {
            border-color: rgba(255, 255, 255, 0.35);
            background: transparent;
            color: white;
        }

        main {
            display: grid;
            grid-template-columns: minmax(18rem, 0.85fr) minmax(22rem, 1.3fr) minmax(18rem, 0.85fr);
            gap: 1rem;
            padding: 1rem;
            align-items: start;
        }

        body[data-layout="1"] main {
            grid-template-columns: minmax(22rem, 1fr) minmax(22rem, 1fr);
        }

        body[data-layout="0"] main {
            grid-template-columns: minmax(22rem, 60rem);
            justify-content: center;
        }

        section {
            min-width: 0;
        }

        .panel {
            background: white;
            border: 1px solid #d7dee4;
            border-radius: 6px;
            padding: 1rem;
        }

        .panel h2 {
            margin: 0 0 0.75rem;
            font-size: 0.95rem;
        }

        #form-panel {
            min-height: calc(100vh - 6rem);
        }

        textarea,
        pre {
            box-sizing: border-box;
            width: 100%;
            min-height: calc(100vh - 13rem);
            margin: 0;
            border: 1px solid #d7dee4;
            border-radius: 4px;
            background: #fbfcfd;
            color: #17212b;
            font: 0.85rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow: auto;
            padding: 0.75rem;
            white-space: pre-wrap;
        }

        #rdf-output.valid {
            color: #176b3a;
        }

        #rdf-output.invalid {
            color: #9f1d20;
        }

        .panel-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        shacl-form {
            display: block;
        }

        @media (max-width: 1000px) {
            main,
            body[data-layout="1"] main,
            body[data-layout="0"] main {
                grid-template-columns: 1fr;
            }

            textarea,
            pre {
                min-height: 18rem;
            }
        }
    </style>
</head>
<body data-layout="0">
    <header>
        <div class="toolbar">
            <span class="toolbar-title">RML authoring demo</span>
            <a href="../">Generic SHACL demo</a>
            <button id="toggle-shapes-btn" type="button">Show shapes</button>
            <button id="toggle-output-btn" type="button">Show RDF</button>
        </div>
    </header>

    <main>
        <section id="shapes-panel" class="panel" hidden>
            <h2>Input shapes</h2>
            <textarea id="shapes-editor" spellcheck="false"></textarea>
            <div class="panel-actions">
                <button id="apply-shapes-btn" type="button">Apply shapes</button>
            </div>
        </section>

        <section id="form-panel" class="panel">
            <h2>RML mappings</h2>
            <shacl-form
                id="shacl-form"
                data-collapse=""
                data-values-namespace="http://example.org/"
                data-show-node-ids
                data-ignore-owl-imports
            ></shacl-form>
        </section>

        <section id="output-panel" class="panel" hidden>
            <h2>Generated Turtle</h2>
            <pre id="rdf-output">Interacting with form...</pre>
            <div class="panel-actions">
                <button id="export-btn" type="button">Download .ttl</button>
            </div>
        </section>
    </main>
</body>
</html>
